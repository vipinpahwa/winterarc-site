<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Winter Arc</title>
<style>
  :root { --bg:#f2f5fb; --panel:#fff; --ink:#0b1b33; --muted:#5e7a9e; --accent:#2e6fd8; --line:rgba(43,98,201,.14); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg:#0c1524; --panel:#121f33; --ink:#eef3fb; --muted:#8fa6c6; --accent:#6fc0ff; --line:rgba(120,170,255,.16); } }
  :root[data-theme="dark"] { --bg:#0c1524; --panel:#121f33; --ink:#eef3fb; --muted:#8fa6c6; --accent:#6fc0ff; --line:rgba(120,170,255,.16); }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:40px 16px;
    font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; }
  .card { max-width:520px; width:100%; }
  .eyebrow { font-size:12px; font-weight:700; letter-spacing:1.8px; color:var(--muted); text-transform:uppercase; }
  h1 { font-size:38px; margin:10px 0 6px; letter-spacing:-.6px; }
  p { color:var(--muted); margin:0 0 26px; }
  a.link { display:block; background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:18px 20px; margin-bottom:12px; text-decoration:none; color:var(--ink); font-weight:600; }
  a.link span { display:block; font-weight:400; font-size:14px; color:var(--muted); margin-top:3px; }
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">Winter Arc</div>
  <h1>Finish the year ahead.</h1>
  <p>A time-boxed habit tracker for iPhone. Everything stays on your device.</p>
  <a class="link" href="support.html">Support<span>Common questions and how to get in touch</span></a>
  <a class="link" href="privacy.html">Privacy Policy<span>What the app stores, and what it never collects</span></a>
</div>
</body>
</html>
